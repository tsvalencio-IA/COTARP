plugins { id 'com.android.application' }

android {
    namespace 'br.com.thiaguinhosolucoes.transcritor'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.thiaguinhosolucoes.transcritor'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.3.0'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
