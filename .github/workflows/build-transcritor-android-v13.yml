name: Build Transcritor IA Android v1.3.0

on:
  workflow_dispatch:
  push:
    branches: [ transcritor-ia-unificado-build ]
    paths:
      - 'transcritor-app/android/**'
      - '.github/workflows/build-transcritor-android-v13.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: transcritor-app/android
        run: gradle --no-daemon assembleDebug
      - name: Verify and rename APK
        shell: bash
        run: |
          test -f transcritor-app/android/app/build/outputs/apk/debug/app-debug.apk
          cp transcritor-app/android/app/build/outputs/apk/debug/app-debug.apk TranscritorIA-Android-v1.3.0.apk
          sha256sum TranscritorIA-Android-v1.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TranscritorIA-Android-v1.3.0
          path: TranscritorIA-Android-v1.3.0.apk
          if-no-files-found: error
