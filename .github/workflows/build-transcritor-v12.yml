name: Build Transcritor IA v1.2.0

on:
  workflow_dispatch:
  push:
    branches: [ transcritor-ia-unificado-build ]
    paths:
      - 'transcritor-app/**'
      - 'build-v12/**'
      - '.github/workflows/build-transcritor-v12.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified Windows source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-v12\source-b64\part*.txt" | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 source parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          if ($b64.Length -ne 31128) { throw "Unexpected base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("transcritor-v1.2.0-source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "transcritor-v1.2.0-source.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source SHA256: $hash"
          if ($hash -ne "b29536325ce5e1d6e899a562045606d98cff2e8b041e6231150bc247bc4a04a1") { throw "Source hash mismatch" }
          Expand-Archive -Path "transcritor-v1.2.0-source.zip" -DestinationPath "." -Force
          Copy-Item "build-v12\installer.iss" "TranscritorIA-v1.2.0\TranscritorIA-Windows\installer.iss" -Force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r "TranscritorIA-v1.2.0\TranscritorIA-Windows\requirements.txt"
      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile "TranscritorIA-v1.2.0\TranscritorIA-Windows\transcritor_windows.py"
          node --check "TranscritorIA-v1.2.0\TranscritorIA-WhatsApp-Extension\content.js"
          node --check "TranscritorIA-v1.2.0\TranscritorIA-WhatsApp-Extension\background.js"
          node --check "TranscritorIA-v1.2.0\TranscritorIA-WhatsApp-Extension\page-hook.js"
      - name: Build portable
        shell: pwsh
        run: |
          cd "TranscritorIA-v1.2.0\TranscritorIA-Windows"
          pyinstaller --noconfirm --clean --onefile --windowed --name TranscritorIA --collect-all imageio_ffmpeg --collect-all tkinterdnd2 --collect-all reportlab transcritor_windows.py
          if (!(Test-Path "dist\TranscritorIA.exe")) { throw "Portable EXE not created" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          cd "TranscritorIA-v1.2.0\TranscritorIA-Windows"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (!(Test-Path "installer_out\TranscritorIA-Setup-v1.2.0-FIX.exe")) { throw "Installer not created" }
      - name: Package extension
        shell: pwsh
        run: Compress-Archive -Path "TranscritorIA-v1.2.0\TranscritorIA-WhatsApp-Extension\*" -DestinationPath "TranscritorIA-WhatsApp-Extension-v1.2.0.zip" -Force
      - name: Verify outputs
        shell: pwsh
        run: |
          Get-FileHash "TranscritorIA-v1.2.0\TranscritorIA-Windows\dist\TranscritorIA.exe" -Algorithm SHA256
          Get-FileHash "TranscritorIA-v1.2.0\TranscritorIA-Windows\installer_out\TranscritorIA-Setup-v1.2.0-FIX.exe" -Algorithm SHA256
          Get-FileHash "TranscritorIA-WhatsApp-Extension-v1.2.0.zip" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: TranscritorIA-Windows-v1.2.0
          path: |
            TranscritorIA-v1.2.0/TranscritorIA-Windows/dist/TranscritorIA.exe
            TranscritorIA-v1.2.0/TranscritorIA-Windows/installer_out/TranscritorIA-Setup-v1.2.0-FIX.exe
            TranscritorIA-WhatsApp-Extension-v1.2.0.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: transcritor-app/android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp transcritor-app/android/app/build/outputs/apk/debug/app-debug.apk TranscritorIA-Android-v1.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TranscritorIA-Android-v1.2.0
          path: TranscritorIA-Android-v1.2.0.apk
          if-no-files-found: error
