name: Build Transcritor IA v1.2.0

on:
  workflow_dispatch:
  push:
    branches: [ transcritor-ia-unificado-build ]
    paths:
      - 'transcritor-app/**'
      - 'build-v12/**'
      - '.github/workflows/build-transcritor-v12.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract Windows source
        shell: pwsh
        run: |
          Expand-Archive -Path "transcritor-v1.2.0-source.zip" -DestinationPath "v12src" -Force
          $root = Get-ChildItem "v12src" -Directory | Select-Object -First 1
          $win = Join-Path $root.FullName "TranscritorIA-Windows"
          $ext = Join-Path $root.FullName "TranscritorIA-WhatsApp-Extension"
          Copy-Item "build-v12\installer.iss" (Join-Path $win "installer.iss") -Force
          "WIN_DIR=$win" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXT_DIR=$ext" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate and install Python dependencies
        shell: pwsh
        run: |
          python -m py_compile "$env:WIN_DIR\transcritor_windows.py"
          node --check "$env:EXT_DIR\content.js"
          node --check "$env:EXT_DIR\background.js"
          node --check "$env:EXT_DIR\page-hook.js"
          pip install -r "$env:WIN_DIR\requirements.txt"
      - name: Build portable
        shell: pwsh
        run: |
          Set-Location $env:WIN_DIR
          pyinstaller --noconfirm --clean --onefile --windowed --name TranscritorIA --collect-all imageio_ffmpeg --collect-all tkinterdnd2 --collect-all reportlab transcritor_windows.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          Set-Location $env:WIN_DIR
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Package extension
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:EXT_DIR\*" -DestinationPath "TranscritorIA-WhatsApp-Extension-v1.2.0.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TranscritorIA-Windows-v1.2.0
          path: |
            ${{ env.WIN_DIR }}/dist/TranscritorIA.exe
            ${{ env.WIN_DIR }}/installer_out/TranscritorIA-Setup-v1.2.0.exe
            TranscritorIA-WhatsApp-Extension-v1.2.0.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: transcritor-app/android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp transcritor-app/android/app/build/outputs/apk/debug/app-debug.apk TranscritorIA-Android-v1.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TranscritorIA-Android-v1.2.0
          path: TranscritorIA-Android-v1.2.0.apk
          if-no-files-found: error
