name: Build Transcritor IA Windows

on:
  workflow_dispatch:
  push:
    branches:
      - transcritor-windows-build
    paths:
      - 'transcritor-windows-src.b64'
      - '.github/workflows/build-transcritor-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $b64 = Get-Content -Raw transcritor-windows-src.b64
          [IO.File]::WriteAllBytes("transcritor-windows-source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive transcritor-windows-source.zip -DestinationPath . -Force
          Get-ChildItem TranscritorIA-Windows
          Get-ChildItem TranscritorIA-WhatsApp-Extension

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r TranscritorIA-Windows/requirements.txt

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile TranscritorIA-Windows/transcritor_windows.py

      - name: Build portable EXE
        shell: pwsh
        run: |
          cd TranscritorIA-Windows
          pyinstaller --noconfirm --clean --onefile --windowed --name TranscritorIA --collect-all imageio_ffmpeg --collect-all tkinterdnd2 --collect-all reportlab transcritor_windows.py
          if (!(Test-Path dist/TranscritorIA.exe)) { throw "Portable EXE not created" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          cd TranscritorIA-Windows
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (!(Test-Path installer_out/TranscritorIA-Setup-v1.1.0.exe)) { throw "Installer not created" }

      - name: Package extension
        shell: pwsh
        run: |
          Compress-Archive -Path TranscritorIA-WhatsApp-Extension -DestinationPath TranscritorIA-WhatsApp-Extension-v1.1.0.zip -Force

      - name: Verify outputs
        shell: pwsh
        run: |
          Get-Item TranscritorIA-Windows/dist/TranscritorIA.exe | Format-List Name,Length,LastWriteTime
          Get-Item TranscritorIA-Windows/installer_out/TranscritorIA-Setup-v1.1.0.exe | Format-List Name,Length,LastWriteTime
          Get-Item TranscritorIA-WhatsApp-Extension-v1.1.0.zip | Format-List Name,Length,LastWriteTime
          Get-FileHash TranscritorIA-Windows/dist/TranscritorIA.exe -Algorithm SHA256
          Get-FileHash TranscritorIA-Windows/installer_out/TranscritorIA-Setup-v1.1.0.exe -Algorithm SHA256
          Get-FileHash TranscritorIA-WhatsApp-Extension-v1.1.0.zip -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: TranscritorIA-Windows-WhatsApp-v1.1.0
          path: |
            TranscritorIA-Windows/dist/TranscritorIA.exe
            TranscritorIA-Windows/installer_out/TranscritorIA-Setup-v1.1.0.exe
            TranscritorIA-WhatsApp-Extension-v1.1.0.zip
          if-no-files-found: error
